[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subcheck-local"
version = "0.1.0"
description = "Local subtitle review with open Whisper speech recognition"
requires-python = ">=3.10"
dependencies = ["faster-whisper==1.2.1"]

[project.scripts]
subcheck = "subcheck.cli:main"

[tool.setuptools.packages.find]
include = ["subcheck*"]
